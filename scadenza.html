<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scadenze - DocuBot</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<!-- Header -->
<div class="bg-green-600 text-white p-4 sticky top-0">
<div class="max-w-md mx-auto flex items-center justify-between">
<h1 class="text-xl font-bold">📅 Scadenze</h1>
<a href="archivio.html" class="text-sm bg-green-700 px-3 py-1 rounded-full">📁 Archivio</a>
</div>
</div>
<!-- Riepilogo -->
<div class="max-w-md mx-auto p-4">
<div class="grid grid-cols-3 gap-3 mb-6">
<div class="bg-red-100 p-3 rounded-xl text-center">
<div id="count-urgenti" class="text-2xl font-bold text-red-600">0</div>
<div class="text-xs text-red-700">Urgenti</div>
</div>
<div class="bg-orange-100 p-3 rounded-xl text-center">
<div id="count-prossime" class="text-2xl font-bold text-orange-600">0</div>
<div class="text-xs text-orange-700">Prossime</div>
</div>
<div class="bg-green-100 p-3 rounded-xl text-center">
<div id="count-future" class="text-2xl font-bold text-green-600">0</div>
<div class="text-xs text-green-700">Future</div>
</div>
</div>
<!-- Lista scadenze -->
<h2 class="font-bold text-gray-700 mb-3">Prossime scadenze</h2>
<div id="lista-scadenze" class="space-y-3">
<div class="text-center p-8 text-gray-500">Caricamento...</div>
</div>
</div>
<!-- Bottom nav -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t p-3">
<div class="max-w-md mx-auto flex justify-around text-sm">
<a href="archivio.html" class="text-gray-600">📁 Archivio</a>
<a href="scadenze.html" class="text-green-600 font-bold">📅 Scadenze</a>
<a href="https://wa.me/TUONUMERO" class="text-gray-600">📱 Scan</a>
</div>
</div>
<div class="h-16"></div>
<script>

        const tel = localStorage.getItem('doctel');

        if(!tel) location.href = 'index.html';

        // DATI FINTI

        const scadenze = [

            { id: 'doc3', entity_name: 'Fornitore ABC', amount: '890.00', due_date: '2025-03-30', days: 5, type: 'fattura' },

            { id: 'doc1', entity_name: 'ENEL Energia', amount: '124.50', due_date: '2025-04-15', days: 21, type: 'bolletta' },

            { id: 'doc2', entity_name: 'Assicurazione XYZ', amount: '450.00', due_date: '2025-05-20', days: 56, type: 'assicurazione' }

        ];

        function mostraScadenze(dati) {

            const oggi = new Date();

            // Contatori

            let urgenti = 0, prossime = 0, future = 0;

            dati.forEach(d => {

                if(d.days <= 7) urgenti++;

                else if(d.days <= 30) prossime++;

                else future++;

            });

            document.getElementById('count-urgenti').textContent = urgenti;

            document.getElementById('count-prossime').textContent = prossime;

            document.getElementById('count-future').textContent = future;

            // Lista

            const container = document.getElementById('lista-scadenze');

            container.innerHTML = '';

            // Ordina per giorni

            dati.sort((a,b) => a.days - b.days);

            dati.forEach(d => {

                const div = document.createElement('div');

                const isUrgente = d.days <= 7;

                const isProssima = d.days <= 30;

                div.className = 'bg-white rounded-lg shadow p-4 border-l-4 ' + 

                    (isUrgente ? 'border-red-500' : isProssima ? 'border-orange-400' : 'border-green-400');

                div.innerHTML = `
<div class="flex justify-between items-start">
<div>
<div class="flex items-center gap-2 mb-1">
<span class="text-xs px-2 py-0.5 rounded-full ${isUrgente ? 'bg-red-100 text-red-700' : isProssima ? 'bg-orange-100 text-orange-700' : 'bg-green-100 text-green-700'} font-bold">

                                    ${d.days <= 0 ? 'OGGI' : d.days + ' gg'}
</span>
<span class="text-xs text-gray-500 uppercase">${d.type}</span>
</div>
<h3 class="font-bold text-gray-800">${d.entity_name}</h3>
<p class="text-green-600 font-bold">€${d.amount}</p>
</div>
<a href="documento.html?id=${d.id}" class="text-green-600 font-bold text-xl">›</a>
</div>
<div class="mt-2 text-sm text-gray-500">

                        ${new Date(d.due_date).toLocaleDateString('it-IT', {weekday: 'short', day: 'numeric', month: 'short'})}
</div>

                `;

                container.appendChild(div);

            });

        }

        mostraScadenze(scadenze);

        // Quando hai n8n:

        // fetch('https://TUO-N8N.com/webhook/scadenze?tel=' + tel)

        //     .then(r => r.json())

        //     .then(mostraScadenze);
</script>
</body>
</html>
